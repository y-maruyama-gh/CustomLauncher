<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Launcher V3</title><style>:root{--accent:#1e88e5}body{margin:0;padding:12px;color:#fff;font-family:sans-serif;background:#111;background-size:cover;background-position:center;background-attachment:fixed}body::before{content:'';position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:-1}.search{width:85%;margin:8px auto 14px;display:block;padding:14px;border-radius:18px;border:none;background:rgba(255,255,255,.9)}.tabs{display:flex;gap:8px;overflow-x:auto}.tab,.tabadd{background:rgba(40,40,40,.8);backdrop-filter:blur(8px);border:none;color:#fff;border-radius:20px;padding:8px 16px}.active{background:var(--accent)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.icon{text-align:center;position:relative}.icon img{width:64px;height:64px;border-radius:16px}.label{margin-top:4px;font-size:13px}.del{display:none;position:absolute;right:0;top:-6px;border:none;background:none;color:#fff;font-size:22px}.edit .del{display:block}.addicon{height:64px;display:flex;align-items:center;justify-content:center;font-size:48px}.gear{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border:none;border-radius:50%;background:var(--accent);color:#fff;font-size:24px}.menu{display:none;position:fixed;right:20px;bottom:88px;background:#222;padding:10px;border-radius:12px}.menu button{display:block;width:100%;margin:4px 0}.modal{display:none;position:fixed;inset:0;background:#0008}.panel{width:90%;max-width:380px;margin:80px auto;background:#222;color:#fff;padding:16px;border-radius:12px}.panel input{width:100%;padding:10px;margin:6px 0}</style></head><body><form id="searchForm"><input id="search" class="search" placeholder="検索またはURLを入力"></form><div id="tabs" class="tabs"></div><div id="grid" class="grid"></div><button class="gear" onclick="toggleMenu()">⚙</button><div id="menu" class="menu"><button onclick="toggleEdit()">編集モード</button><button onclick="bgPicker.click()">背景画像設定</button><button onclick="clearBg()">背景削除</button><button onclick="exportJson()">JSONバックアップ</button><button onclick="imp.click()">JSON復元</button><input id="bgPicker" type=file accept='image/*' style='display:none'><input id="imp" type=file accept='.json' style='display:none'></div><div id="dlg" class="modal"><div class="panel"><h3>サイト追加</h3><input id="siteName" placeholder="サイト名"><input id="siteUrl" placeholder="https://"><button onclick="saveSite()">保存</button><button onclick="closeDlg()">閉じる</button></div></div><script>let editMode=false;let data=JSON.parse(localStorage.getItem('portalV3'))||{categories:[{name:'AI',sites:[{name:'Copilot',url:'https://copilot.microsoft.com'}]},{name:'Microsoft',sites:[{name:'Outlook',url:'https://outlook.live.com'},{name:'OneDrive',url:'https://onedrive.live.com'}]}]};let current=data.categories[0].name;function save(){localStorage.setItem('portalV3',JSON.stringify(data));}function applyBg(){const bg=localStorage.getItem('portalBg');if(bg)document.body.style.backgroundImage='url('+bg+')';}function render(){tabs.innerHTML='';data.categories.forEach(c=>{let b=document.createElement('button');b.className='tab'+(c.name===current?' active':'');b.textContent=c.name;b.onclick=()=>{current=c.name;render()};tabs.appendChild(b)});let plus=document.createElement('button');plus.className='tabadd';plus.textContent='+';plus.onclick=()=>{let n=prompt('カテゴリ名');if(n){data.categories.push({name:n,sites:[]});current=n;render();}};tabs.appendChild(plus);grid.innerHTML='';let cat=data.categories.find(x=>x.name===current);cat.sites.forEach((s,i)=>{let d=document.createElement('div');d.className='icon'+(editMode?' edit':'');let h=new URL(s.url).hostname;d.innerHTML=`<button class="del" onclick="delSite(${i})">×</button><a href="${s.url}"><img src="https://www.google.com/s2/favicons?domain=${h}&sz=128"></a><div class="label">${s.name}</div>`;grid.appendChild(d)});let a=document.createElement('div');a.className='icon';a.innerHTML='<div class="addicon">+</div><div class="label">追加</div>';a.onclick=openDlg;grid.appendChild(a);save();}function openDlg(){dlg.style.display='block'}function closeDlg(){dlg.style.display='none'}function saveSite(){let n=siteName.value.trim(),u=siteUrl.value.trim();if(!n||!u)return;data.categories.find(x=>x.name===current).sites.push({name:n,url:u});siteName.value='';siteUrl.value='';closeDlg();render()}function delSite(i){if(confirm('削除しますか？')){data.categories.find(x=>x.name===current).sites.splice(i,1);render();}}function toggleMenu(){menu.style.display=menu.style.display==='block'?'none':'block'}function toggleEdit(){editMode=!editMode;render()}document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();let q=search.value.trim();if(q.startsWith('http://')||q.startsWith('https://')) location.href=q; else location.href='https://www.google.com/search?q='+encodeURIComponent(q)};function exportJson(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='portal-v3-backup.json';a.click()}imp.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{data=JSON.parse(r.result);current=data.categories[0].name;render()};r.readAsText(f)};bgPicker.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=x=>{localStorage.setItem('portalBg',x.target.result);applyBg()};r.readAsDataURL(f)};function clearBg(){localStorage.removeItem('portalBg');document.body.style.backgroundImage='none';}applyBg();render();</script></body></html>
